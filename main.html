<!DOCTYPE html>
<html lang="en">
  <head> <meta charset="UTF-8" />
    <title>FE 1주차 과제</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!--아이디, 비번 옆 그림 빌려왔어용-->
  </head>
<body>

    <div class="main-container"> <!--메인 네모-->
        
        <div class="left-section"> <!--왼쪽-->
            <div class="header-area">
                <img src="YU_LikeLion.png" style="width: 100px" class="logo" alt="영남대 로고">
                <div class="title-area"> 
                    <h2>영남대학교</h2>
                    <h1>멋쟁이사자처럼</h1>
                    <h3>14기</h3>
                </div>
            </div>

            <div class="text-area">
                <p>여러분들을 진심으로 환영합니다!</p>
                <p>멋쟁이사자처럼은 성장 의지를 가진 사람들을 돕기 위해 존재합니다.<br>
                그리고 이들을 돕기 위한 가장 근본적이고 효과적인 방법은 교육이라<br>
                고 생각합니다!</p>
            </div>

            <div class="button-group">
                <button class="btn btn-white">P&D</button>
                <button class="btn btn-white">FE</button>
                <button class="btn btn-white">BE</button>
            </div>
        </div>

        <div class="right-section">
            <div class="login-card">
                <h2>LOGIN</h2>
                
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="username">
                </div>
                
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="password">
                </div>

                <button class="login-btn">로그인</button>
            </div>
        </div>

    </div>

</body>
</html>
